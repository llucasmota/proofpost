name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit tests & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Unit tests use fakes for every LLM, Tavily and HTTP call: no API keys needed.
      - run: npm test

      - run: npx tsc --noEmit
